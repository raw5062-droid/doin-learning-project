name: Temporary aerial retrieval

on:
  push:
    branches:
      - tmp-aerial-1989-retrieval-20260804
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe VWorld historical imagery endpoints
        shell: bash
        run: |
          set -u
          mkdir -p out
          python3 - <<'PY'
          import os, ssl, urllib.request, urllib.parse, urllib.error, json, math, time

          out='out'
          lon=126.9327033
          lat=37.4709232
          bbox=(lon-0.002,lat-0.002,lon+0.002,lat+0.002)
          keys=[
              '3XE3C10E-82B7-3E7F-AC31-37175F32CDE4',
              '767B7ADF-10BA-3D86-AB7E-02816B5B92E9',
          ]
          bases=[
              'http://xdworld.vworld.kr:8080/XDServer/3DData',
              'https://xdworld.vworld.kr:8080/XDServer/3DData',
              'https://xdworld.vworld.kr/XDServer/3DData',
          ]
          ctx=ssl.create_default_context()
          report=[]

          def safe_name(s):
              return ''.join(c if c.isalnum() or c in '._-' else '_' for c in s)[:180]

          def get(url, label):
              rec={'label':label,'url':url}
              try:
                  req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (historical-aerial-research)'} )
                  with urllib.request.urlopen(req, timeout=60, context=ctx) as r:
                      data=r.read()
                      rec.update(status=getattr(r,'status',None), final_url=r.geturl(), headers=dict(r.headers), bytes=len(data))
              except urllib.error.HTTPError as e:
                  data=e.read()
                  rec.update(status=e.code, final_url=e.geturl(), headers=dict(e.headers), bytes=len(data), error=str(e))
              except Exception as e:
                  data=b''
                  rec.update(error=repr(e), bytes=0)
              fn=os.path.join(out, safe_name(label)+'.bin')
              open(fn,'wb').write(data)
              open(os.path.join(out,safe_name(label)+'.json'),'w',encoding='utf-8').write(json.dumps(rec,ensure_ascii=False,indent=2,default=str))
              report.append(rec)
              print(label, rec.get('status'), rec.get('bytes'), rec.get('error',''))
              return data,rec

          for bi,base in enumerate(bases):
              for ki,key in enumerate(keys):
                  params={'Version':'2.0.0.0','Request':'GetCapabilities','Key':key}
                  get(base+'?'+urllib.parse.urlencode(params), f'cap_b{bi}_k{ki}')
                  params={'Version':'2.0.0.0','Request':'GetLayerExists','Key':key,'Layer':'T198901','Level':'16','BBOX':','.join(map(str,bbox)),'CheckFlag':'True'}
                  get(base+'?'+urllib.parse.urlencode(params), f'exists_1989_b{bi}_k{ki}_l16')
                  for level in (14,15,16):
                      idx=math.floor((lon+180.0)/360.0*(10*(2**level)))
                      idy=math.floor((lat+90.0)/180.0*(5*(2**level)))
                      params={'Version':'2.0.0.0','Request':'GetLayer','Key':key,'Layer':'T198901','Level':str(level),'IDX':str(idx),'IDY':str(idy)}
                      get(base+'?'+urllib.parse.urlencode(params), f'layer_1989_b{bi}_k{ki}_l{level}_x{idx}_y{idy}')

          # Standard VWorld 2D tile patterns, current and historical candidates.
          def slippy(lon,lat,z):
              n=2**z
              x=int((lon+180.0)/360.0*n)
              y=int((1-math.asinh(math.tan(math.radians(lat)))/math.pi)/2*n)
              return x,y
          for z in (16,17,18,19):
              x,y=slippy(lon,lat,z)
              patterns=[
                  f'https://xdworld.vworld.kr/2d/Satellite/service/{z}/{x}/{y}.jpeg',
                  f'https://xdworld.vworld.kr/2d/Satellite/service/{z}/{x}/{y}.png',
                  f'https://xdworld.vworld.kr/2d/T198901/service/{z}/{x}/{y}.jpeg',
                  f'https://xdworld.vworld.kr/2d/T198901/service/{z}/{x}/{y}.png',
                  f'https://xdworld.vworld.kr/2d/T198901/{z}/{x}/{y}.jpeg',
                  f'https://xdworld.vworld.kr/2d/T198901/{z}/{x}/{y}.png',
                  f'http://xdworld.vworld.kr:8080/2d/T198901/service/{z}/{x}/{y}.jpeg',
                  f'http://xdworld.vworld.kr:8080/2d/T198901/service/{z}/{x}/{y}.png',
              ]
              for pi,u in enumerate(patterns):
                  get(u, f'tile_z{z}_p{pi}_x{x}_y{y}')

          # XDWorld equirectangular node paths sometimes used by image layers.
          for level in (14,15,16):
              idx=math.floor((lon+180.0)/360.0*(10*(2**level)))
              idy=math.floor((lat+90.0)/180.0*(5*(2**level)))
              for layer in ('T198901','timeseries'):
                  for ext in ('jpg','jpeg','png'):
                      for tmpl in (
                          f'https://xdworld.vworld.kr/3d/{layer}/{level}/{idx}/{idy}.{ext}',
                          f'https://xdworld.vworld.kr/XDServer/layer/{layer}/{level}/{idx}/{idy}.{ext}',
                          f'https://xdworld.vworld.kr:8080/XDServer/layer/{layer}/{level}/{idx}/{idy}.{ext}',
                      ):
                          get(tmpl, f'node_{layer}_l{level}_x{idx}_y{idy}_{ext}_{abs(hash(tmpl))%100000}')

          open(os.path.join(out,'report.json'),'w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2,default=str))
          PY

          echo '=== file types ===' > out/file-types.txt
          find out -type f -name '*.bin' -print0 | xargs -0 file >> out/file-types.txt || true
          echo '=== sizes ===' > out/sizes.txt
          find out -type f -printf '%s %p\n' | sort -nr >> out/sizes.txt
      - name: Upload retrieval diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: aerial-retrieval-diagnostics
          path: out/
          if-no-files-found: error
          retention-days: 1
