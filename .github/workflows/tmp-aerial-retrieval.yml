name: Temporary aerial retrieval

on:
  push:
    branches:
      - tmp-aerial-1989-retrieval-20260804
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: browser-actions/setup-chrome@v1
      - name: Install Korean fonts and browser helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
          pip install --quiet selenium pillow
      - name: Capture enhanced historical aerial evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import json, time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          out=Path('out')
          lat=37.4709232
          lon=126.9327033
          options=Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=3200,2400')
          options.add_argument('--ignore-certificate-errors')
          options.add_argument('--lang=ko-KR')
          options.set_capability('goog:loggingPrefs',{'browser':'ALL','performance':'ALL'})
          driver=webdriver.Chrome(options=options)
          driver.set_script_timeout(60)
          summary={'target':{'road_address':'서울특별시 관악구 원신2길 25','parcel_address':'서울특별시 관악구 신림동 808-495','lat':lat,'lon':lon},'source':'스마트서울맵'}
          try:
              driver.get('https://map.seoul.go.kr/smgis2/seoulMap')
              WebDriverWait(driver,50).until(lambda d: d.execute_script("return typeof M !== 'undefined' && M.map && typeof getFlyMapGallery === 'function' && typeof changeFlyMap === 'function'"))
              time.sleep(10)
              result=driver.execute_async_script("""
                const done=arguments[0];
                getFlyMapGallery().then(r=>done(JSON.stringify({ok:true,data:r}))).catch(e=>done(JSON.stringify({ok:false,error:String(e)})));
              """)
              wrapper=json.loads(result)
              if not wrapper.get('ok'): raise RuntimeError(wrapper.get('error','gallery error'))
              gallery=wrapper['data']; children=(gallery.get('DATA') or [{}])[0].get('children') or []
              (out/'gallery.json').write_text(json.dumps(gallery,ensure_ascii=False,indent=2),encoding='utf-8')
              driver.execute_script('FLY_MAPGALLERY=arguments[0];',children)
              by_year={str(x.get('dataset_nm')):x for x in children}
              selected=by_year['1989']; summary['selected_1989']=selected
              # Expand the map to the full browser width and permit the layer's native max zoom.
              try: driver.execute_script('menuClose();')
              except Exception: pass
              driver.execute_script("M.map.setMaxZoom(18); M.map.options.maxZoom=18; M.map.invalidateSize();")
              time.sleep(3)
              map_el=driver.find_element(By.ID,'map')

              def render(year,zoom,label,wait=24):
                  entry=by_year[year]
                  driver.execute_script("M.map.setView([arguments[0],arguments[1]],arguments[2],{animate:false}); changeFlyMap(arguments[3]);",lat,lon,zoom,entry['toc_nm'])
                  time.sleep(wait)
                  state=driver.execute_script("var p=M.map.latLngToContainerPoint([arguments[0],arguments[1]]);return {center:M.map.getCenter(),zoom:M.map.getZoom(),point:p,size:M.map.getSize(),year:M.NOW_GEOTIFF_NAME};",lat,lon)
                  summary[label]=state
                  map_el.screenshot(str(out/(label+'.png')))

              render('1989',16,'1989_z16_with_source_controls',24)
              render('1989',17,'1989_z17_with_source_controls',26)
              render('1989',18,'1989_z18_with_source_controls',28)

              # Return to zoom 17 and overlay present-day cadastral parcel boundaries.
              driver.execute_script("M.map.setView([arguments[0],arguments[1]],17,{animate:false});",lat,lon)
              time.sleep(16)
              try:
                  driver.execute_script("if($('#smCb_boundaryJijuk').attr('class')!='on'){fn_viewBoundary('smCb_boundaryJijuk');}")
                  time.sleep(28)
                  summary['cadastral_flag']=driver.execute_script("return {cls:$('#smCb_boundaryJijuk').attr('class'), layer:FLAG_SEOUL_BOUNDARY.smCb_boundaryJijuk ? true:false};")
                  map_el.screenshot(str(out/'1989_z17_with_cadastral_boundary.png'))
              except Exception as e:
                  summary['cadastral_error']=repr(e)

              # Remove the boundary if present, then capture 2020 at the same location/scale for comparison.
              try:
                  driver.execute_script("if($('#smCb_boundaryJijuk').attr('class')=='on'){fn_viewBoundary('smCb_boundaryJijuk');}")
                  time.sleep(8)
              except Exception: pass
              render('2020',17,'2020_z17_same_location',24)

              # Restore 1989 zoom 17, hide floating controls but keep imagery and copyright attribution.
              render('1989',17,'1989_z17_preclean',24)
              driver.execute_script("""
                ['#map_control','#map_moveSeoul','#map_center_division','#mapGradeBtn','#map_susermapSmall','#map_susermapSmall2','#map_selectMap_popup','#maploading','.leaflet-control-zoom','.m_open','.aside_open','.aside_close'].forEach(sel=>document.querySelectorAll(sel).forEach(el=>el.style.display='none'));
              """)
              time.sleep(2)
              map_el.screenshot(str(out/'1989_z17_clean.png'))
              summary['final_point']=driver.execute_script("var p=M.map.latLngToContainerPoint([arguments[0],arguments[1]]);return {x:p.x,y:p.y,size:M.map.getSize(),zoom:M.map.getZoom(),center:M.map.getCenter(),year:M.NOW_GEOTIFF_NAME};",lat,lon)
              (out/'browserlog.json').write_text(json.dumps(driver.get_log('browser'),ensure_ascii=False,indent=2),encoding='utf-8')
          except Exception as e:
              summary['error']=repr(e)
              try:
                  driver.save_screenshot(str(out/'error_page.png'))
                  (out/'error_page.html').write_text(driver.page_source,encoding='utf-8')
                  (out/'browserlog.json').write_text(json.dumps(driver.get_log('browser'),ensure_ascii=False,indent=2),encoding='utf-8')
              except Exception: pass
              raise
          finally:
              (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2,default=str),encoding='utf-8')
              driver.quit()
          PY
      - name: Upload enhanced evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aerial-1989-enhanced
          path: out/
          if-no-files-found: error
          retention-days: 1
