name: Temporary aerial retrieval

on:
  push:
    branches:
      - tmp-aerial-1989-retrieval-20260804
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependencies
        run: pip install --quiet requests pillow
      - name: Retrieve official Smart Seoul Map orthophoto chronology
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import concurrent.futures, json, re
          from pathlib import Path
          from urllib.parse import quote
          import requests
          from PIL import Image

          out=Path('out')
          years=['1978','1989','1996','2006','2019','2020']
          xmins=[949760+16*i for i in range(10)]
          ymins=[1941392+16*i for i in range(7)]
          headers={'User-Agent':'Mozilla/5.0 (historical aerial evidence retrieval)'}
          session=requests.Session(); session.headers.update(headers)

          def url_for(year,xmin,ymin):
              xmax=xmin+16; ymax=ymin+16
              return (
                'https://map.seoul.go.kr/smgis2/proxy?url=prop/tileMapGeoserver/wms?'
                '&service=WMS&request=GetMap&layers=tile_map_t2w%3Ad_layer&styles='
                '&format=image%2Fpng&transparent=true&version=1.0.0&tiled=true'
                f'&env=pattern%3A%2F{year}%3Bmax_level%3A19%3B'
                '&width=256&height=256&srs=EPSG%3A5179'
                f'&bbox={xmin},{ymin},{xmax},{ymax}'
              )

          jobs=[(year,x,y,url_for(year,x,y)) for year in years for x in xmins for y in ymins]
          def fetch(job):
              year,x,y,url=job
              rec={'year':year,'xmin':x,'ymin':y,'url':url}
              try:
                  r=session.get(url,timeout=(10,35),allow_redirects=True)
                  rec.update(status=r.status_code,content_type=r.headers.get('content-type'),bytes=len(r.content))
                  if r.status_code==200 and r.content.startswith(b'\x89PNG'):
                      p=out/f'{year}_{x}_{y}.png'; p.write_bytes(r.content); rec['file']=p.name
                  else:
                      rec['body_preview']=r.content[:200].decode('utf-8','replace')
              except Exception as e:
                  rec['error']=repr(e)
              return rec

          with concurrent.futures.ThreadPoolExecutor(max_workers=28) as ex:
              records=list(ex.map(fetch,jobs))
          (out/'requests.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')

          summary={'years':{},'crs':'EPSG:5179','bounds':[949760,1941392,949920,1941504],'tile_span_m':16,'tile_pixels':256}
          for year in years:
              year_records=[r for r in records if r['year']==year]
              good=[r for r in year_records if r.get('file')]
              summary['years'][year]={'requested':len(year_records),'downloaded':len(good),'errors':[r for r in year_records if not r.get('file')]}
              canvas=Image.new('RGBA',(2560,1792),(255,255,255,255))
              for r in good:
                  im=Image.open(out/r['file']).convert('RGBA')
                  px=(r['xmin']-949760)//16*256
                  py=(1941504-(r['ymin']+16))//16*256
                  canvas.alpha_composite(im,(int(px),int(py)))
              bg=Image.new('RGB',canvas.size,'white'); bg.paste(canvas,mask=canvas.getchannel('A'))
              bg.save(out/f'{year}_orthophoto.png',optimize=True)
          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          for year,v in summary['years'].items(): print(year,v['downloaded'],'/',v['requested'])
          PY
      - name: Upload chronology
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aerial-orthophoto-chronology
          path: out/
          if-no-files-found: error
          retention-days: 1
