name: Temporary Narration Fetch

on:
  push:
    paths:
      - '.github/workflows/fetch-narration.yml'
      - 'narration-trigger.txt'
  workflow_dispatch:

jobs:
  fetch-narration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download narration chunks
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/9d56b461-a213-4043-b199-ddba387d843f.mp3' -o narration_01.mp3
          curl -L --fail --retry 3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/aa748a72-ac38-4416-b035-6aa436dabd5d.mp3' -o narration_02.mp3
          curl -L --fail --retry 3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/32e47e54-15fb-4786-a117-9abf25298eb8.mp3' -o narration_03.mp3
          curl -L --fail --retry 3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/2840b5bb-5fa7-462d-89b5-e16cc032b9ae.mp3' -o narration_04.mp3
          file narration_*.mp3
          ls -lh narration_*.mp3
      - name: Upload narration artifact
        uses: actions/upload-artifact@v4
        with:
          name: narration-chunks
          path: narration_*.mp3
          if-no-files-found: error
          retention-days: 1
