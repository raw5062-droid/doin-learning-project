name: Temporary Stock Video Redirect Check

on:
  push:
    paths:
      - '.github/workflows/fetch-narration.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Pexels download redirects
        run: |
          set -euo pipefail
          for id in 1190185 8212372 7062351 33509759 34786856 34796505 30285726; do
            echo "===== VIDEO $id ====="
            curl -sS -A 'Mozilla/5.0' -o /dev/null -D - "https://www.pexels.com/download/video/$id/" | grep -iE '^(HTTP/|location:|content-type:|content-length:)' || true
          done
