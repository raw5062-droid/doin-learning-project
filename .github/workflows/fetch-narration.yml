name: Temporary Extra Stock Redirect Check

on:
  push:
    paths:
      - 'stock-trigger.txt'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Pexels redirects
        run: |
          set -euo pipefail
          for id in 19919758 8212368 7062358 7280528 7279738 34796504 16657123 34498310; do
            echo "===== VIDEO $id ====="
            curl -sS -A 'Mozilla/5.0' -o /dev/null -D - "https://www.pexels.com/download/video/$id/" | grep -iE '^(HTTP/|location:|content-type:|content-length:)' || true
          done
