name: Temporary Narration Fetch

on:
  push:
    paths:
      - '.github/workflows/fetch-narration.yml'
      - 'narration-trigger.txt'
  workflow_dispatch:

jobs:
  fetch-narration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Inspect full narration endpoint
        run: |
          curl -L --retry 3 -D response_headers.txt \
            'https://www.aidocmaker.com/g0/audio?name=129ba00ff7a1413785ea2f39569dbe43' \
            -o response_body.html
          file response_body.html
          wc -c response_body.html
          head -c 1000 response_body.html || true
      - name: Upload endpoint response
        uses: actions/upload-artifact@v4
        with:
          name: narration-endpoint-response
          path: |
            response_body.html
            response_headers.txt
          if-no-files-found: error
          retention-days: 1
