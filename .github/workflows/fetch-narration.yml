name: Temporary Extra Stock Download

on:
  push:
    paths:
      - 'stock-trigger.txt'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download and normalize extra stock clips
        run: |
          set -euo pipefail
          mkdir -p stock_extra
          make_clip() {
            name="$1"; url="$2"; seek="$3"
            curl -L --fail --retry 3 -A 'Mozilla/5.0' "$url" -o "${name}_raw.mp4"
            ffmpeg -hide_banner -loglevel error -y -ss "$seek" -i "${name}_raw.mp4" -t 8 \
              -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=24,eq=saturation=0.78:contrast=1.08:brightness=-0.025" \
              -an -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -movflags +faststart "stock_extra/${name}.mp4"
            rm -f "${name}_raw.mp4"
          }
          make_clip bed_phone 'https://videos.pexels.com/video-files/19919758/19919758-uhd_3840_2160_24fps.mp4' 1
          make_clip room_scroll 'https://videos.pexels.com/video-files/8212368/8212368-uhd_3840_2160_25fps.mp4' 1
          make_clip neon_talk 'https://videos.pexels.com/video-files/7062358/7062358-hd_1080_1920_24fps.mp4' 1
          make_clip distressed_phone 'https://videos.pexels.com/video-files/7280528/7280528-uhd_3840_2160_25fps.mp4' 1
          make_clip waterfront_phone 'https://videos.pexels.com/video-files/34796504/14753452_1920_1080_60fps.mp4' 1
          make_clip hoodie_phone 'https://videos.pexels.com/video-files/16657123/16657123-uhd_3840_2160_24fps.mp4' 1
          make_clip young_phone 'https://videos.pexels.com/video-files/34498310/14617296_1920_1080_30fps.mp4' 1
          ls -lh stock_extra
      - name: Upload extra stock clips
        uses: actions/upload-artifact@v4
        with:
          name: stock-extra
          path: stock_extra/*.mp4
          if-no-files-found: error
          retention-days: 1
