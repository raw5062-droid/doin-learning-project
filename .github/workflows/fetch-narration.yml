name: Temporary Narration Fetch

on:
  push:
    paths:
      - '.github/workflows/fetch-narration.yml'
      - 'narration-trigger.txt'
  workflow_dispatch:

jobs:
  fetch-narration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download generated narration
        run: |
          curl -L --fail --retry 3 \
            'https://www.aidocmaker.com/g0/audio?name=129ba00ff7a1413785ea2f39569dbe43' \
            -o narration_full.mp3
          file narration_full.mp3
          ls -lh narration_full.mp3
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 narration_full.mp3
      - name: Upload narration artifact
        uses: actions/upload-artifact@v4
        with:
          name: narration-full
          path: narration_full.mp3
          if-no-files-found: error
          retention-days: 1
