name: Temporary Flannan Public Domain Assets

on:
  push:
    paths:
      - '.github/workflows/tmp-flannan-sample-assets.yml'
  workflow_dispatch:

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download public domain map assets
        run: |
          set -euo pipefail
          mkdir -p pd_assets
          curl -L --fail --retry 3 'https://upload.wikimedia.org/wikipedia/commons/0/0e/Flannan_isles.jpg' -o pd_assets/flannan_1898.jpg
          sleep 2
          curl -L --fail --retry 3 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1c/Admiralty_Chart_No_3331_Flannan_Isles%2C_Published_1903.jpg/1280px-Admiralty_Chart_No_3331_Flannan_Isles%2C_Published_1903.jpg' -o pd_assets/admiralty_chart_1903.jpg
          file pd_assets/*
          ls -lh pd_assets
      - name: Upload public domain assets
        uses: actions/upload-artifact@v4
        with:
          name: flannan-extra-pd
          path: pd_assets
          if-no-files-found: error
          retention-days: 1
